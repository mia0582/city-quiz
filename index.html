  function validAnswers(a) { return Array.isArray(a)&&a.length===questions.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<4); }
  function scores(a) {
    if(!validAnswers(a)) throw new Error('请完成全部 12 题');
    return dims.map(d=>{
      const indexes=questions.map((q,i)=>q.dim===d.id?i:-1).filter(i=>i>=0);
      return Math.round(indexes.reduce((s,i)=>s+questions[i].options[a[i]].value,0)/indexes.length);
    });
  }
  function rank(a) {
    const values=scores(a);
    return cities.map(city=>{
      const distance=Math.sqrt(values.reduce((s,v,i)=>s+(v-city.profile[i])**2,0)/dims.length);
      return {city,match:Math.round(100-distance),distance};
    }).sort((a,b)=>a.distance-b.distance||a.city.id.localeCompare(b.city.id));
  }
  function makeResult(a,nick='',now=new Date().toISOString()) {
    const values=scores(a), ranking=rank(a);
    const safeName=String(nick).replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,20);
    return {version:VERSION,id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),nickname:safeName,createdAt:now,answers:a.slice(),scores:values,cityId:ranking[0].city.id};
  }
  function restoreResult(data) {
    if(!data||data.version!==VERSION||!validAnswers(data.answers)) throw new Error('文件不是这个版本的有效测试结果');
    const timestamp=typeof data.createdAt==='string'&&!Number.isNaN(Date.parse(data.createdAt))?data.createdAt:new Date().toISOString();
    const clean=makeResult(data.answers,data.nickname||'',timestamp);
    if(typeof data.id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(data.id)) clean.id=data.id;
    return clean;
  }
  const api={VERSION,dims,questions,cities,validAnswers,scores,rank,makeResult,restoreResult};
  if(typeof module!=='undefined'&&module.exports) module.exports=api;
  else root.CityQuiz=api;
})(typeof window!=='undefined'?window:globalThis);

  }
  function quiz(){const q=Q.questions[index],answered=answers.filter(x=>x!==null).length;
    return `<section class="quiz"><div class="quiz-top"><button class="text-button" data-action="home">← 暂存并返回</button><span class="question-count">${String(index+1).padStart(2,'0')} / 12</span></div><div class="progress" role="progressbar" aria-label="已答题进度" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="12"><div class="progress-fill" style="width:${answered/12*100}%"></div></div><div class="question-meta"><span class="question-no">${String(index+1).padStart(2,'0')}</span><span class="eyebrow">${Q.dims.find(d=>d.id===q.dim).name}</span></div><h1 class="question-title">${q.title}</h1><p class="question-hint">${q.hint}</p><div class="options" role="group" aria-label="单选答案">${q.options.map((o,i)=>`<button class="option" data-action="choose" data-option="${i}" aria-pressed="${answers[index]===i}"><span class="option-letter" aria-hidden="true">${'ABCD'[i]}</span><span>${o.text}</span><span class="tick" aria-hidden="true">${answers[index]===i?'✓':''}</span></button>`).join('')}</div><div class="quiz-actions"><button class="ghost" data-action="previous" ${index===0?'disabled':''}>上一题</button><button class="primary" data-action="next" ${answers[index]===null?'disabled':''}>${index===11?'完成，查看结果':'下一题'} <span aria-hidden="true">→</span></button></div><p class="quiz-foot">没有标准答案，选最像你的那个。可随时返回修改。<br>${storageOk?'选择已自动暂存，关闭后可在此浏览器继续。':'当前浏览器无法暂存，完成后请下载结果。'}</p></section>`;
  }
  function finish(){return `<section class="quiz"><div class="quiz-top"><button class="text-button" data-action="back-to-last">← 返回检查答案</button><span class="question-count">12 / 12</span></div><div class="progress"><div class="progress-fill" style="width:100%"></div></div><div class="question-meta"><span class="question-no">✓</span><span class="eyebrow">你的城市来信，即将抵达</span></div><h1 class="question-title">留一个称呼，<br>把结果写给自己。</h1><p class="question-hint">昵称选填。留空也可以直接查看结果。</p><div class="form-row"><label for="nickname">你的昵称（选填，最多 20 个字符）</label><input id="nickname" type="text" maxlength="20" autocomplete="off" placeholder="例如：小林" value="${esc(nickname)}"></div><div class="finish-summary">${Q.dims.map(d=>`<span class="pill">${d.name} ✓</span>`).join('')}</div><button class="primary" data-action="calculate">打开我的城市来信 <span aria-hidden="true">→</span></button><p class="quiz-foot">答案和昵称保存在自己的设备，不会上传。<br>浏览器中最多保留最近 50 次结果；图片和备份可长期保存。</p></section>`;}
  function date(t){return new Date(t).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
  function reasoning(r,city){const close=Q.dims.map((d,i)=>({d,i,gap:Math.abs(r.scores[i]-city.profile[i])})).sort((a,b)=>a.gap-b.gap).slice(0,3);return close.map(({d,i})=>`「${d.name}」${r.scores[i]>=60?d.high:r.scores[i]<=40?d.low:'倾向在两者间保持平衡'}`).join('；')+'。这几个选择，与本测试对这座城市的风格描述更接近。';}
  function result(){const r=current,ranking=Q.rank(r.answers),top=ranking[0],city=top.city;
    return `<div class="page-heading"><h2>你的城市来信</h2><button class="text-button" data-action="history">查看历史 →</button></div><section class="result-layout"><div><article class="result-card" id="result-card" aria-label="${city.name}测试结果卡片"><div class="card-top"><span>一城一面</span><span>生活偏好 · NO. 001</span></div><div class="card-title"><p class="pre">${esc(r.nickname?r.nickname+'的本命城市':'我的本命城市')}</p><h2>${city.name}</h2><p class="roman">${city.en}</p></div><div class="card-art">${art(city.profile[1]>=85?'nature':'mixed')}</div><p class="card-tag">${city.tag}</p><div class="tags">${city.tags.map(t=>`<span>${t}</span>`).join('<span aria-hidden="true">·</span>')}</div><div class="card-bottom"><div><span class="stamp">FOLLOW YOUR OWN RHYTHM</span><p>${esc(date(r.createdAt))}<br>生活偏好趣味测试 · 非科学量表</p></div><div><div class="score">${top.match}<small>/100</small></div><p>偏好相似度</p></div></div></article><p class="result-note">${storageOk?'✓ 已保存在此浏览器的「我的结果」。':'当前浏览器无法保存历史，请下载图片或备份。'}<br>换设备或清理浏览器前，建议导出一份备份。</p></div><div class="result-story"><div class="eyebrow">A LETTER FOR ${city.en}</div><h3>总有一种生活，<br>与你的节奏同频。</h3><p>${city.story}</p><div class="reason">${reasoning(r,city)}</div><div class="result-block"><h3>你的六维生活偏好</h3><div class="dim-list">${Q.dims.map((d,i)=>`<div class="dim-row"><div class="labels"><span>${d.name}</span><span class="value">${r.scores[i]} / 100</span></div><div class="dim-track"><span style="width:${r.scores[i]}%"></span></div><div class="dim-poles"><span>${d.low}</span><span>${d.high}</span></div></div>`).join('')}</div></div><div class="result-block"><h3>把它变成一次小小的尝试</h3><p>${city.tryout}</p></div><div class="result-block"><h3>真正住下来，还要看看</h3><p>${city.reality}</p></div></div></section><section class="actions-panel"><div class="cta-row"><button class="primary" data-action="save-image">保存结果图片 ↓</button><button class="secondary" data-action="share-result">分享我的结果</button><button class="secondary" data-action="invite">邀请朋友测试</button><button class="ghost" data-action="export-result">下载结果备份</button><button class="ghost" data-action="review">查看我的答案</button><button class="ghost" data-action="new-test">再测一次</button></div><p class="micro">相似度是本测试的规则计算值，不代表居住适宜概率。结果会随你的生活阶段和选择变化。</p></section><h3 class="alternative-title">你也可以看看这两座城</h3><section class="alternatives">${ranking.slice(1,3).map(({city,match})=>`<div class="alt"><div><h3>${city.name}</h3><p>${city.tag}</p><p>${city.tags.join(' · ')}</p></div><span class="percent">${match}<small style="font-size:11px"> /100</small></span></div>`).join('')}</section>`;
  }
  function history(){return `<section class="history-page"><div class="page-heading"><h2>我的结果 <span style="color:var(--muted);font-size:14px">${records.length}</span></h2><button class="text-button" data-action="home">返回首页 →</button></div><p class="history-info">这是你在当前浏览器里的城市来信。<br>结果仅存于此设备，最多保留最近 50 次；导出备份后，可以在其他设备导入。</p>${records.length?records.map(r=>{const top=Q.rank(r.answers)[0];return `<article class="history-item"><div class="city">${top.city.name}</div><div class="detail"><p>${esc(r.nickname||'匿名参与者')} · 偏好相似度 ${top.match}/100</p><p>${esc(date(r.createdAt))}</p></div><button class="secondary" data-action="open-result" data-id="${r.id}">查看结果</button></article>`;}).join(''):`<div class="empty"><h3>第一封城市来信，还在路上。</h3><p>做一次测试，或导入之前保存的结果备份。</p><button class="primary" data-action="start">开始测试 →</button></div>`}<div class="history-tools"><button class="secondary" data-action="export-all" ${records.length?'':'disabled'}>导出全部备份</button><button class="ghost" data-action="import">导入结果备份</button></div></section>`;}
  function render(){updateCount();main.innerHTML=({home,quiz,finish,result,history}[mode])();}
  function modal(title,html){if(posterUrl){URL.revokeObjectURL(posterUrl);posterUrl=null;}$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;$('#modal').showModal();}
  function closeModal(){if(posterUrl){URL.revokeObjectURL(posterUrl);posterUrl=null;}$('#modal').close();}
  function about(){modal('这封城市来信，怎样写成？',`<p>这是一套原创的生活偏好趣味测试。12 道题、6 个维度、16 座候选城市，灵感来自“本命城市”类社交测试，题目、插画、解读和规则均重新设计。</p><h3>结果怎样计算</h3><p>每个维度有 2 题，每个选项对应 0、33、67 或 100 分；两题平均后四舍五入，组成你的六维偏好。各城市也有作者设定的六维风格画像。用六个维度的均方根差距进行排序，相似度 = 100 − 差距，并四舍五入。各维度等权，分数并非科学验证的概率。</p><h3>结果的适用范围</h3><p>城市画像是对生活风格的主观概括，不是城市统计指标。这里没有测试你的性格类型、运势或职业能力。搬家与求职还需要结合真实岗位、租金、家庭和气候等信息判断。</p><h3>保存与分享</h3><p>不需要登录，不上传答案或昵称。进度和最近 50 次结果仅保存在此浏览器。清理浏览器数据会清除记录；请下载图片或 JSON 备份。若设备限制下载，可长按结果图片保存。备份可从「我的结果」导入。邀请链接分享测试入口，不包含你的答案与昵称。</p><p>原创版本 ${Q.VERSION} · 一城一面</p>`);}
  function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  function jsonBlob(data){return new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});}
  function exported(r){return {...r,testName:'一城一面',scoring:'equal-weight-rms-v1',answersDetail:Q.questions.map((q,i)=>({question:q.title,option:'ABCD'[r.answers[i]],answer:q.options[r.answers[i]].text})),city:Q.rank(r.answers)[0].city.name};}
  function wrap(ctx,text,x,y,maxWidth,size,lineHeight,maxLines=5){ctx.font=size+'px "Microsoft YaHei", "PingFang SC", sans-serif';let line='',n=0;for(const ch of text){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y+n*lineHeight);line='';n++;if(n>=maxLines)return y+n*lineHeight;}line+=ch;}if(line)ctx.fillText(line,x,y+n*lineHeight);return y+(n+1)*lineHeight;}
  async function createPoster(r){
    const top=Q.rank(r.answers)[0],city=top.city,canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1500;const ctx=canvas.getContext('2d');
    ctx.fillStyle='#eef0e4';ctx.fillRect(0,0,1080,1500);ctx.fillStyle='#dfe8d3';ctx.fillRect(44,44,992,1412);ctx.strokeStyle='#b9c9ab';ctx.strokeRect(64,64,952,1372);
    ctx.fillStyle='#42614b';ctx.textAlign='left';ctx.font='25px "Microsoft YaHei",sans-serif';ctx.fillText('一城一面',105,135);ctx.textAlign='right';ctx.font='19px sans-serif';ctx.fillText('FIND YOUR CITY / 001',975,135);
    ctx.textAlign='center';ctx.fillStyle='#5d715d';wrap(ctx,r.nickname?r.nickname+'的本命城市':'我的本命城市',540,235,830,32,44,2);
    ctx.fillStyle='#243b34';ctx.font='144px "Songti SC","SimSun",serif';ctx.fillText(city.name,540,430);ctx.fillStyle='#bd6547';ctx.font='28px Georgia,serif';ctx.fillText(city.en,540,493);
    const svg=art(city.profile[1]>=85?'nature':'mixed').replace('role="img"','');const blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);const img=new Image();
    try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('插画生成失败'));img.src=url;});ctx.drawImage(img,100,535,880,468);}finally{URL.revokeObjectURL(url);}
    ctx.textAlign='center';ctx.fillStyle='#294b37';wrap(ctx,city.tag,540,1070,855,42,56,2);ctx.fillStyle='#64775f';ctx.font='25px "Microsoft YaHei",sans-serif';ctx.fillText(city.tags.join('  ·  '),540,1150);
    ctx.strokeStyle='#b9c9ab';ctx.beginPath();ctx.moveTo(105,1200);ctx.lineTo(975,1200);ctx.stroke();ctx.textAlign='left';ctx.fillStyle='#bd6547';ctx.font='22px Georgia,serif';ctx.fillText('FOLLOW YOUR OWN RHYTHM',105,1260);ctx.fillStyle='#65785f';ctx.font='21px sans-serif';ctx.fillText(date(r.createdAt),105,1310);ctx.font='20px "Microsoft YaHei",sans-serif';ctx.fillText('生活偏好趣味测试 · 非科学量表',105,1350);
    ctx.textAlign='right';ctx.fillStyle='#243b34';ctx.font='70px Georgia,serif';ctx.fillText(String(top.match),897,1294);ctx.font='24px Georgia,serif';ctx.fillText('/100',975,1294);ctx.fillStyle='#65785f';ctx.font='22px "Microsoft YaHei",sans-serif';ctx.fillText('偏好相似度',975,1344);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('图片导出失败')),'image/png'));
  }
  let activePoster=null;
  async function saveImage(){try{const r=current;toast('正在生成结果图片…');activePoster=await createPoster(r);modal('保存这封城市来信',`<p>点击下载保存 PNG 图片。手机也可以长按下方图片保存到相册。</p><img class="poster-preview" id="poster-preview" alt="${Q.rank(r.answers)[0].city.name}的测试结果图片"><button class="primary" data-action="download-poster">下载 PNG 图片 ↓</button>`);posterUrl=URL.createObjectURL(activePoster);$('#poster-preview').src=posterUrl;toast('图片已生成，可下载或长按保存。');}catch{toast('图片暂时无法生成，请下载结果备份。');}}
  async function copy(text){try{await navigator.clipboard.writeText(text);return true;}catch{return false;}}
  function publicUrl(){const u=new URL(location.href);u.hash='';u.search='';if(!/^https?:$/.test(u.protocol)||['localhost','127.0.0.1','::1','[::1]'].includes(u.hostname))return null;return u.href;}
  async function invite(){const url=publicUrl();if(!url){modal('邀请朋友一起测',`<p>当前是本地预览，手机公网分享需要先把网页放到托管平台。上线后，这个按钮会自动分享正式测试入口。</p><p>也可以将完整网页文件发给朋友，由对方在浏览器打开。</p><button class="secondary" data-action="download-page">下载完整测试网页</button>`);return;}const data={title:'一城一面 · 你的本命城市',text:'12 个日常选择，找一座与你同频的城。免费测试，结果可以保存。',url};if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e.name==='AbortError')return;}}if(await copy(url)){toast('测试链接已复制，可以发给朋友。');}else{modal('分享测试入口',`<p>复制下面的链接发给朋友，他们可以独立完成测试并保存自己的结果。</p><code class="share-url">${esc(url)}</code>`);}}
  async function shareResult(){const top=Q.rank(current.answers)[0],text=`我的本命城市是${top.city.name}，偏好相似度 ${top.match}/100。${top.city.tag}。一城一面 · 生活偏好趣味测试。`,url=publicUrl();try{if(navigator.share){const blob=await createPoster(current),file=new File([blob],'我的城市来信.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({title:'我的城市来信',text,files:[file]});return;}await navigator.share({title:'我的城市来信',text,...(url?{url}:{})});return;}if(await copy(text+(url?'\n一起测试：'+url:''))){toast('结果文案已复制；还可以保存图片发送给朋友。');}else{modal('分享我的结果',`<p class="break-anywhere">${esc(text)}</p><p>可手动复制文案，或保存结果图片后发送。</p><button class="primary" data-action="save-image">生成结果图片</button>`);}}catch(e){if(e.name!=='AbortError')toast('当前浏览器暂不支持直接分享，请保存图片后发送。');}}
  function review(){modal('你的 12 个日常选择',`<div class="answer-review">${Q.questions.map((q,i)=>`<div class="review-item"><strong>${i+1}. ${q.title}</strong><p>${'ABCD'[current.answers[i]]}. ${q.options[current.answers[i]].text}</p></div>`).join('')}</div>`);}
  function start(fresh=false){if(fresh||!draft){answers=Array(12).fill(null);index=0;nickname='';saveDraft();}else{answers=draft.answers.slice();nickname=String(draft.nickname||'').slice(0,20);index=Number.isInteger(draft.index)?Math.max(0,Math.min(11,draft.index)):Math.max(0,answers.findIndex(x=>x===null));}navigate(answers.every(x=>x!==null)?'finish':'quiz');}
  async function importResults(file){if(!file)return;if(file.size>1024*1024){toast('文件太大，请选择小于 1 MB 的结果备份。');return;}try{const data=JSON.parse(await file.text()),list=Array.isArray(data)?data:(data.results||[data]);if(!Array.isArray(list)||!list.length||list.length>50)throw new Error('请导入包含 1 至 50 条结果的备份');const incoming=list.map(Q.restoreResult);const count=incoming.filter(r=>!records.some(x=>x.id===r.id)).length;const merged=new Map([...records,...incoming].map(r=>[r.id,r]));records=Array.from(merged.values()).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt)).slice(0,50);saveRecords();navigate('history');toast(`已导入 ${count} 条结果，最多保留最近 50 条。`);}catch(e){toast('无法导入：'+(e instanceof SyntaxError?'文件不是有效 JSON':e.message));}}
  document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
    switch(action){
      case 'home':if(mode==='quiz'||mode==='finish')saveDraft();navigate('home');break;
      case 'history':if(mode==='quiz'||mode==='finish')saveDraft();navigate('history');break;
      case 'start':start();break;
      case 'new-test':start(true);break;
      case 'choose':answers[index]=Number(b.dataset.option);saveDraft();navigate('quiz',false);main.querySelector(`[data-option="${answers[index]}"]`).focus({preventScroll:true});break;
      case 'next':if(answers[index]===null)return;if(index===11)navigate('finish');else{index++;saveDraft();navigate('quiz');}break;
      case 'previous':if(index>0){index--;saveDraft();navigate('quiz');}break;
      case 'back-to-last':index=11;navigate('quiz');break;
      case 'calculate':if(!Q.validAnswers(answers)){toast('请先完成所有题目');return;}nickname=$('#nickname').value;current=Q.makeResult(answers,nickname);storeResult(current);draft=null;try{localStorage.removeItem(DRAFT);}catch{}navigate('result');break;
      case 'open-result':current=records.find(r=>r.id===b.dataset.id);if(current)navigate('result');break;
      case 'about':about();break;
      case 'close-modal':closeModal();break;
      case 'save-image':if($('#modal').open)closeModal();await saveImage();break;
      case 'download-poster':if(activePoster){download(activePoster,`城市来信-${Q.rank(current.answers)[0].city.name}.png`);toast('已开始下载；手机也可长按图片保存。');}break;
      case 'export-result':download(jsonBlob(exported(current)),`城市来信-${Q.rank(current.answers)[0].city.name}.json`);toast('已导出备份，可在「我的结果」导入。');break;
      case 'export-all':download(jsonBlob({version:Q.VERSION,testName:'一城一面',results:records.map(exported)}),'一城一面-全部结果备份.json');toast('已开始下载全部结果备份。');break;
      case 'import':$('#import-file').click();break;
      case 'invite':await invite();break;
      case 'share-result':await shareResult();break;
      case 'review':review();break;
      case 'download-page':{const doc=document.cloneNode(true);doc.querySelector('#main').innerHTML='';doc.querySelector('#modal-body').innerHTML='';doc.querySelector('#modal-title').textContent='';doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#history-count').textContent='0';doc.querySelector('#toast').textContent='';doc.querySelector('#toast').classList.remove('show');download(new Blob(['<!doctype html>\n'+doc.documentElement.outerHTML],{type:'text/html;charset=utf-8'}),'一城一面-城市测试.html');toast('已开始下载，使用浏览器打开即可测试。');break;}
    }
  });
  document.addEventListener('input',e=>{if(e.target.id==='nickname'){nickname=e.target.value;saveDraft();}});
  $('#import-file').addEventListener('change',async e=>{await importResults(e.target.files[0]);e.target.value='';});
  $('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  $('#modal').addEventListener('close',()=>{if(posterUrl){URL.revokeObjectURL(posterUrl);posterUrl=null;}});
  render();
})();
</script>
</body>
</html>
